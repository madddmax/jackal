server {
	listen 443 ssl http2;
	listen [::]:443 ipv6only=on ssl http2;

	server_name jackal.team;

	root /root/madddmax/jackal/Front/dist;
	index index.html;

	ssl_certificate /etc/ssl/jackal_team_2027_05_20.crt;
	ssl_certificate_key /etc/ssl/jackal_team_2027_05_20.key;
	ssl_session_timeout 5m;
	
	# Безопасность: Отключаем устаревшие и небезопасные TLSv1 и TLSv1.1
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ALL:EECDH+aRSA+AESGCM:EDH+aRSA+AESGCM:EECDH+aRSA+AES:EDH+aRSA+AES;
	ssl_prefer_server_ciphers on;

	# Настройки проксирования по умолчанию
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	location /api {
		proxy_pass http://localhost:5130;
	}

	# Секция для SignalR (веб-сокеты)
	location /gamehub {
		proxy_pass http://localhost:5130;
		
		# Заголовки для Upgrade соединения до WebSocket
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade"; 
		
		proxy_cache_bypass $http_upgrade;
		
		# Увеличиваем таймауты, чтобы SignalR соединения не рвались по дефолту через 60 сек
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}

	location / {
		add_header Cache-Control "max-age=2592000";
		try_files $uri $uri/ /index.html;
	}
}